name: Flutter Android Build (etrip)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run Analyze
        run: |
          flutter analyze 2>&1 | tee analysis_report.txt || true

      - name: Run Tests
        run: |
          flutter test 2>&1 | tee test_report.txt || true

      - name: Build Release APK
        run: |
          flutter build apk --release 2>&1 | tee build_log.txt
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "APK built successfully!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etrip-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etrip-build-log
          if-no-files-found: warn
          path: |
            build_log.txt
            analysis_report.txt
            test_report.txt
