name: Flutter iOS Build (etrip)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee build_log.txt
          echo "iOS build done (no codesign)"

      - name: Upload iOS Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etrip-ios-build-log
          if-no-files-found: warn
          path: build_log.txt
