name: Flutter Web Build (etrip)

on:
  push:
    branches:
      - main
      - develop/travel-redesign
  pull_request:
    branches:
      - main
      - develop/travel-redesign
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etrip-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Analyze, test and build Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Enable Web
        run: flutter config --enable-web

      - name: Scaffold missing Web platform files
        run: flutter create . --platforms=web --project-name=ecardo_etrip --org=com.ecardo

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check Travel foundation formatting
        run: dart format --output=none --set-exit-if-changed lib/src/features/travel test/travel_foundation_widgets_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Build Web release
        run: flutter build web --release

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: etrip-web-release-${{ github.sha }}
          path: build/web
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etrip-web-diagnostics-${{ github.sha }}
          path: |
            build/web
            .dart_tool/dart_tool.log
          if-no-files-found: ignore
