name: Flutter Web Build (etrip)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Web (release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Enable Web
        run: flutter config --enable-web

      - name: Scaffold web platform files
        run: |
          flutter create . --platforms=web --project-name=ecardo_etrip --org=com.ecardo 2>&1 | tail -5 || true

      - name: Customize web index title
        run: |
          sed -i 's|<title>ecardo_etrip</title>|<title>etrip — رزرو اقامتگاه eCardo</title>|' web/index.html || true
          sed -i 's|"name": "ecardo_etrip"|"name": "etrip"|; s|"short_name": "ecardo_etrip"|"short_name": "etrip"|' web/manifest.json || true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Web (with base-href for /etrip/web-app/)
        run: flutter build web --release --base-href /etrip/web-app/

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etrip-web-release
          path: build/web
          if-no-files-found: warn
